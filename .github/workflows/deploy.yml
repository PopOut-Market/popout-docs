# NOTE: Deployment now happens on Vercel via its GitHub integration (auto-build
# on push to main + preview builds on PRs). This GitHub Pages workflow is kept
# for reference / fallback but no longer runs on push, so it can't produce red
# runs while Pages stays disabled. Re-add the `push` trigger below to switch
# back to Pages. See the Deployment section of README.md.

name: Deploy to GitHub Pages

on:
  # Manual-only. Vercel owns automatic deploys now (see note above).
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queue new runs rather than cancelling
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for the "last updated" timestamps

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
